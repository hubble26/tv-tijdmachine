<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TV-Tijdmachine</title>
  <meta name="description" content="Blader door decennia televisiegeschiedenis: een privécollectie tv-opnames, jaar voor jaar, met wat er toen gebeurde.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=VT323&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect x='3' y='7' width='26' height='19' rx='4' fill='%23e8a33d'/><rect x='6' y='10' width='16' height='13' rx='2' fill='%23161310'/><circle cx='25.5' cy='13' r='1.6' fill='%23161310'/><circle cx='25.5' cy='19' r='1.6' fill='%23161310'/><path d='M11 7 7 2M19 7l4-5' stroke='%23e8a33d' stroke-width='2' stroke-linecap='round'/></svg>">
</head>
<body>
  <header class="top">
    <a class="logo" href="#/">
      <span class="logo-tv" aria-hidden="true"></span>
      <span>TV-Tijdmachine</span>
    </a>
    <form class="zoek" role="search" onsubmit="return false">
      <label class="sr-only" for="zoekveld">Zoek in de collectie</label>
      <div class="zoekbalk">
        <input id="zoekveld" type="search" placeholder="Zoek op titel, zender, jaar…" autocomplete="off">
        <button type="button" id="spreek" class="spreek" aria-label="Vraag het met je stem" title="Vraag het met je stem">
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M12 15a3.5 3.5 0 0 0 3.5-3.5v-6a3.5 3.5 0 1 0-7 0v6A3.5 3.5 0 0 0 12 15Zm6-3.5a1 1 0 1 0-2 0 4 4 0 0 1-8 0 1 1 0 1 0-2 0 6 6 0 0 0 5 5.91V20H8.5a1 1 0 1 0 0 2h7a1 1 0 1 0 0-2H13v-2.59A6 6 0 0 0 18 11.5Z"/></svg>
        </button>
      </div>
      <select id="filter-zender" aria-label="Filter op zender"><option value="">Alle zenders</option></select>
      <select id="filter-genre" aria-label="Filter op genre"><option value="">Alle genres</option></select>
      <select id="filter-box" aria-label="Filter op bron of box"><option value="">Alle bronnen</option><option value="schijf">Harde schijf</option></select>
      <select id="sorteer" aria-label="Sorteren"><option value="datum">Sorteer op datum</option><option value="box">Sorteer op box</option><option value="titel">Sorteer op titel</option></select>
      <label class="schakel"><input type="checkbox" id="toon-prive"> Familievideo's</label>
    </form>
  </header>
  <p id="spraak-status" class="spraak-status" aria-live="polite" hidden></p>

  <main>
    <section class="kast" aria-label="Kies een periode">
      <div class="decennia" id="decennia" role="tablist" aria-label="Decennium"></div>
      <div class="jaren" id="jaren" aria-label="Jaar"></div>
    </section>

    <section class="scherm-wrap">
      <div class="scherm" id="scherm" aria-live="polite">
        <!-- gevuld door js/app.js -->
      </div>
    </section>
  </main>

  <footer class="voet">
    <p>Een privécollectie televisie-opnames, verzameld, gedigitaliseerd en beschreven door een liefhebber. De rechten op de uitzendingen liggen bij de oorspronkelijke omroepen.</p>
  </footer>

  <dialog id="detail" class="detail">
    <div id="detail-inhoud"></div>
    <form method="dialog"><button class="knop">Sluiten</button></form>
  </dialog>

  <script src="js/app.js"></script>
</body>
</html>
